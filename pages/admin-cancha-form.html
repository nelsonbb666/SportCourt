<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar cancha | Reserva de Canchas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<!-- data-page="admin": guard.js exige sesión + rol "admin" (y las reglas de Firestore lo respaldan) -->
<body data-page="admin">

  <nav class="navbar">
    <a class="logo" href="../index.html">⚽ Reserva de Canchas</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main>
    <section class="contenedor-formulario">
      <h1 id="titulo-form">📋 Registrar cancha</h1>
      <p class="descripcion" id="subtitulo-form">Completa la información de la nueva cancha deportiva.</p>

      <div class="mensaje" id="mensaje-form"></div>

      <form id="formulario-cancha" novalidate>
        <div class="form-grupo">
          <label for="nombre">Nombre de la cancha *</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej.: La Estrella" required />
        </div>

        <div class="form-grupo">
          <label for="tipo">Tipo de cancha *</label>
          <select id="tipo" name="tipo" required>
            <option value="">Selecciona un deporte...</option>
            <!-- Opciones rellenadas por canchas.js (TIPOS_CANCHA) -->
          </select>
        </div>

        <div class="form-grupo">
          <label for="ubicacion">Ubicación *</label>
          <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej.: Av. Central #123, Centro deportivo Norte" required />
        </div>

        <div class="form-grupo">
          <label for="descripcion">Descripción (opcional)</label>
          <textarea id="descripcion" name="descripcion" rows="3" placeholder="Sintético, techada, vestuarios..."></textarea>
        </div>

        <div class="form-grupo">
          <label for="precio-hora">Precio por hora (opcional)</label>
          <input type="number" id="precio-hora" name="precioHora" min="0" step="0.01" placeholder="Ej.: 25000" />
        </div>

        <div class="form-doble">
          <div class="form-grupo">
            <label for="hora-apertura">Hora de apertura *</label>
            <input type="time" id="hora-apertura" name="horaApertura" value="08:00" required />
          </div>
          <div class="form-grupo">
            <label for="hora-cierre">Hora de cierre *</label>
            <input type="time" id="hora-cierre" name="horaCierre" value="22:00" required />
          </div>
        </div>

        <div class="form-grupo campo-check">
          <label>
            <input type="checkbox" id="activa" name="activa" checked />
            Cancha activa (visible para reservas)
          </label>
        </div>

        <button type="submit" id="btn-guardar" class="btn btn-primario btn-bloque">GUARDAR CANCHA</button>
        <a href="canchas.html" class="enlace-volver">← Volver al listado</a>
      </form>
    </section>
  </main>

  <footer>© 2026 Reserva de Canchas — Sprint #2: Gestión de Canchas</footer>

  <script type="module">
    import "../js/guard.js"; // protege: requiere sesión + rol admin
    import { initFormularioCancha } from "../js/canchas.js";
    initFormularioCancha();
  </script>
</body>
</html>
